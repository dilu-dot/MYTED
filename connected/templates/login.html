<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your private space — Teddy</title><link rel="stylesheet" href="/story/assets/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#582339,transparent 65%),#170e15;color:#f7ede2;font-family:Manrope,sans-serif;padding:24px}main{width:100%;max-width:440px;border:1px solid #cc93aa40;border-radius:28px;padding:42px;background:#271821b8;box-shadow:0 25px 100px #0005}.seal{font:italic 42px 'Cormorant Garamond',serif;color:#e5b4c7}.eyebrow{font-size:10px;letter-spacing:.25em;color:#d2a6b7}h1{font:46px/1.05 'Cormorant Garamond',serif;margin:18px 0}p{font-size:13px;line-height:1.8;color:#ceb7c0}label{display:block;font-size:12px;margin:24px 0 8px}input{width:100%;background:#160f17;border:1px solid #a36c815e;color:#fff3e8;border-radius:12px;padding:15px;font:14px Manrope,sans-serif}button{margin-top:26px;border:0;width:100%;border-radius:99px;padding:17px;background:#efd7ba;color:#371929;font:13px Manrope,sans-serif;cursor:pointer}button:hover{box-shadow:0 0 35px #e3abca65}input:focus-visible,button:focus-visible{outline:2px solid #e9b9cf;outline-offset:4px}#status{min-height:24px;color:#f4bbcc}small{display:block;text-align:center;font-size:10px;color:#a58a98;margin-top:20px}
</style></head><body><main><span class="seal" aria-hidden="true">t.</span><p class="eyebrow">A LITTLE SPACE OF YOUR OWN</p><h1>Some moments<br>are yours to keep.</h1><p>Sign in to your private space.</p><form id="login"><label for="email">Your email</label><input id="email" type="email" autocomplete="username" required><label for="password">Private password</label><input id="password" type="password" autocomplete="current-password" required><button>Open my space ↗</button><p id="status" role="status"></p></form><small>Only the owner account can enter.</small></main><script>
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),s=document.querySelector('#status');b.disabled=true;s.textContent='Opening your space…';try{const r=await fetch('/api/owner/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/owner')}catch(e){s.textContent=e.message||'Could not sign in. Please try again.';b.disabled=false}});
</script></body></html>
